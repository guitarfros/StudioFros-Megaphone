name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a GitHub Release when a v* tag is pushed

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^project(StudioFrosMegaphone VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          NAME="StudioFros-Megaphone-${VERSION}-${{ matrix.name }}"

          ART=$(find build -type d -name "StudioFrosMegaphone_artefacts" | head -n 1)
          VST3_DIR=$(find "$ART" -type d -name VST3 | head -n 1)
          APP_DIR=$(find "$ART" -type d -name Standalone | head -n 1)
          echo "artefacts: $ART"; ls -R "$ART" | head -40

          mkdir -p "dist/$NAME/Standalone"
          cp -R "$VST3_DIR"/*.vst3 "dist/$NAME/"
          cp -R "$APP_DIR"/. "dist/$NAME/Standalone/"
          cp LICENSE README.md NOTICE.md CHANGELOG.md "dist/$NAME/"

          if [ "$RUNNER_OS" = "macOS" ]; then
            # ad-hoc signature so Apple Silicon accepts the bundles
            find "dist/$NAME" -maxdepth 2 \( -name "*.vst3" -o -name "*.app" \) -exec codesign --force --deep --sign - {} \;
          fi

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$NAME.zip" "$NAME"
          else
            zip -qry "$NAME.zip" "$NAME"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: StudioFros-Megaphone-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
